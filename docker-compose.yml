services:
  mysql:
    image: mysql:8.0
    container_name: medirag-mysql
    environment:
      MYSQL_ROOT_PASSWORD: medirag123
      MYSQL_DATABASE: medirag
      MYSQL_CHARSET: utf8mb4
    ports:
      - "3306:3306"
    volumes:
      - medirag-mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pmedirag123"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: medirag-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"  # 管理界面 http://localhost:15672
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  medirag-mysql-data:
