services:
  mysql:
    image: mysql:8.0
    container_name: medirag-mysql
    environment:
      MYSQL_ROOT_PASSWORD: medirag123
      MYSQL_DATABASE: medirag
      MYSQL_CHARSET: utf8mb4
    ports:
      - "3306:3306"
    volumes:
      - medirag-mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pmedirag123"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: medirag-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"  # 管理界面 http://localhost:15672
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 向量库（可选）：VECTOR_BACKEND=qdrant 且 QDRANT_URL=http://localhost:6333 时启用。
  # local 嵌入式模式（QDRANT_URL 留空）无需本服务。
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: medirag-qdrant
    ports:
      - "6333:6333"   # REST / gRPC
      - "6334:6334"
    volumes:
      - medirag-qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  medirag-mysql-data:
  medirag-qdrant-data:
